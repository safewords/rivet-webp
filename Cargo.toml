[package]
name = "rivet-webp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/safewords/rivet-webp"
homepage = "https://github.com/safewords/rivet-webp"
documentation = "https://docs.rs/rivet-webp"
authors = ["Ely Erin Fox"]
description = "A WebP decoder and encoder in Rust, written from RFC 9649: lossy (VP8, through rivet-vp8) and lossless (VP8L) stills, alpha (ALPH), animation with compositing, ICC / Exif / XMP passed through. No C, no system libraries, no build script. rivet's WebP codec. Imported as `webp`."
keywords = ["webp", "image", "decoder", "encoder", "lossless"]
categories = ["multimedia::images", "multimedia::encoding"]
exclude = [".github/", "docs/", "tools/"]

[lib]
name = "webp"

[dependencies]
vp8 = { package = "rivet-vp8", git = "https://github.com/safewords/rivet-vp8", branch = "develop" }

[dev-dependencies]
md5 = "0.7"
rpng = { package = "rivet-png", git = "https://github.com/safewords/rivet-png", branch = "develop" }

[profile.test]
opt-level = 2

[features]
default = []
