name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. CI is
# x86-64 Linux only. No Windows, macOS or arm64 jobs: the code stays
# portable, but nothing here tests it there.

# id-token: a push to develop or main shows the compile cache's broker its
# OIDC token to be allowed to write the cache (ci-cache-setup).
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64,   os: safewords-runners }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - name: Tests
        run: cargo test --release
      # The same tests with the AVX2 variants compiled out.
      - name: Tests, baseline code only (force-scalar)
        run: cargo test --release --features force-scalar
      - name: Robustness with overflow checks (debug)
        run: cargo test --test robustness

  # The decoder against Google's public WebP test files and their reference
  # outputs, and the encoder round-tripped over the gallery's natural images.
  # The data is Google's and not in the repository: this job fetches it
  # (~30 MB, every file checked against tools/testdata.sha256).
  conformance:
    name: Google's WebP test data
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - uses: actions/cache@v4
        with:
          path: testdata
          key: webp-testdata-${{ hashFiles('tools/testdata.sha256') }}
      - name: Fetch the test data
        run: python3 tools/fetch_testdata.py testdata
      - name: Conformance
        run: cargo test --release --test conformance -- --nocapture
        env:
          WEBP_TESTDATA_DIR: testdata
      - name: Round trips and compression over natural images
        run: cargo test --release --test roundtrip -- --nocapture
        env:
          WEBP_TESTDATA_DIR: testdata
      - name: Mutated test files
        run: cargo test --release --test robustness mutated
        env:
          WEBP_TESTDATA_DIR: testdata

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo build --release

  lint:
    name: rustfmt, clippy and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # rivet's compile cache, warmed with this commit before rivet's submodule is
  # bumped to it: the commit built inside rivet exactly as rivet's CI builds
  # it (safewords/rivet-transcoder .github/workflows/codec-cache-warmup.yml).
  # Never fails this workflow.
  rivet-cache:
    name: warm rivet's compile cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: safewords/rivet-transcoder/.github/workflows/codec-cache-warmup.yml@develop
    with:
      crates: rivet-webp
      submodule: crates/webp
